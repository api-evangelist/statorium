aid: statorium
name: Statorium
description: >-
  Statorium is a sports data API provider delivering live scores, statistics, schedules, standings, and news across 6+
  sports including Soccer, American Football, Basketball, Hockey, Volleyball, and Handball. The API provides JSON-format
  responses covering over 200 football leagues, NBA, NFL, and other major competitions with full coverage of live data,
  historical data, player stats, team stats, lineups, and predictions.
